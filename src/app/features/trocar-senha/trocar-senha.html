<div class="min-h-screen flex items-center justify-center bg-surface px-4">
  <div class="w-full max-w-md bg-white rounded-2xl shadow-lg p-8 space-y-6">

    <div class="text-center">
      <h1 class="text-2xl font-black text-primary uppercase tracking-wide">EstoquePIM</h1>
      <p class="text-xs text-slate-500 font-bold tracking-widest uppercase mt-1">
        Troca de senha obrigatória
      </p>
    </div>

    <div class="text-center">
      <h2 class="text-xl font-semibold text-on-surface">Altere sua senha</h2>
      <p class="text-sm text-slate-500 mt-1">
        Por segurança, você precisa definir uma nova senha antes de continuar
      </p>
    </div>

    @if (sucesso()) {
      <div class="bg-green-50 text-green-800 text-sm px-4 py-3 rounded-lg text-center">
        ✅ Senha alterada com sucesso! Redirecionando...
      </div>
    }

    @if (error()) {
      <div class="bg-error-container text-on-error-container text-sm px-4 py-3 rounded-lg">
        {{ error() }}
      </div>
    }

    @if (!sucesso()) {
      <form [formGroup]="form" (ngSubmit)="onSubmit()" class="space-y-4">
        <div>
          <label for="senhaAtual" class="block text-sm font-medium text-on-surface mb-1">Senha atual</label>
          <input id="senhaAtual" type="password" formControlName="senhaAtual" placeholder="••••••"
            class="w-full px-4 py-3 rounded-lg border border-outline-variant bg-surface-container-low
                   text-on-surface placeholder-slate-400
                   focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent
                   transition-all duration-200" />
        </div>

        <div>
          <label for="novaSenha" class="block text-sm font-medium text-on-surface mb-1">Nova senha</label>
          <input id="novaSenha" type="password" formControlName="novaSenha" placeholder="••••••"
            class="w-full px-4 py-3 rounded-lg border border-outline-variant bg-surface-container-low
                   text-on-surface placeholder-slate-400
                   focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent
                   transition-all duration-200" />
        </div>

        <div>
          <label for="confirmarSenha" class="block text-sm font-medium text-on-surface mb-1">Confirmar nova senha</label>
          <input id="confirmarSenha" type="password" formControlName="confirmarSenha" placeholder="••••••"
            class="w-full px-4 py-3 rounded-lg border border-outline-variant bg-surface-container-low
                   text-on-surface placeholder-slate-400
                   focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent
                   transition-all duration-200" />
        </div>

        <button type="submit" [disabled]="loading()"
          class="w-full py-3 px-4 bg-primary text-on-primary font-semibold rounded-lg
                 hover:bg-primary-container hover:text-on-primary-container
                 disabled:opacity-50 disabled:cursor-not-allowed transition-all duration-200">
          @if (loading()) { Salvando... } @else { Salvar nova senha }
        </button>
      </form>
    }
  </div>
</div>
