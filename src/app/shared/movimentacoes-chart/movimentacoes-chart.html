<div class="w-full bg-surface-container-low p-6 rounded-xl space-y-4">
    <div class="flex items-center justify-between border-b border-outline-variant/20 pb-4">
        <div>
            <h3 class="text-lg font-bold text-blue-950 uppercase tracking-tighter">Movimentações por Mês</h3>
            <p class="text-xs text-on-surface-variant mt-0.5">Entradas e saídas nos últimos 6 meses</p>
        </div>
    </div>

    @if (loading) {
        <div class="flex items-center justify-center h-48 gap-3">
            <span class="material-symbols-outlined text-2xl text-primary animate-spin">progress_activity</span>
            <span class="text-sm text-on-surface-variant">Carregando dados do gráfico...</span>
        </div>
    } @else if (movimentacoes.length === 0) {
        <div class="flex flex-col items-center justify-center h-48 gap-2 text-on-surface-variant">
            <span class="material-symbols-outlined text-4xl">bar_chart</span>
            <p class="text-sm font-medium">Nenhuma movimentação para exibir</p>
        </div>
    } @else {
        <div class="relative h-56">
            <canvas #movimentacoesChart></canvas>
        </div>
    }
</div>
