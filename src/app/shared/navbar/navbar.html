<header
    class="h-16 bg-slate-100  border-b border-outline-variant/10 px-6 flex items-center justify-between sticky top-0 z-10">
    <div class="flex items-center">
        @if (showBackButton()) {
            <button routerLink="/app/movimentacoes" class="flex items-center gap-2 text-sm font-medium text-slate-600 hover:text-blue-600 dark:text-slate-300 dark:hover:text-blue-400 transition-colors">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>
                Voltar para movimentações
            </button>
        } @else if (pageTitle()) {
            <h2 class="text-xl font-bold tracking-tight text-primary">
                {{ pageTitle() }}
            </h2>
        }
    </div>

    <div class="flex items-center gap-4">

        <div class="flex items-center gap-3">
            <div class="hidden md:block text-right">
                <p class="text-sm font-medium text-slate-700">
                    {{ authService.nomeUsuario() }}
                </p>
            </div>
      
            <div class="w-9 h-9 rounded-full bg-blue-100 dark:bg-blue-900 flex items-center justify-center text-blue-700 dark:text-blue-300 font-bold text-sm">
                {{ (authService.nomeUsuario().charAt(0) || 'U').toUpperCase() }}
            </div>
        </div>
    </div>
</header>
